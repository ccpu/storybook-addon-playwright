name: CI

on:
  push:
    branches:
      - master
      - next
  pull_request:
    branches:
      - master
      - next
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    name: JavaScript Tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test
        env:
          CI: true

      # The MCP server (mcp/) is a separate published package
      # (`storybook-addon-playwright-mcp`) in the same pnpm workspace, with its own
      # tsconfig/vitest/tsup config. Building it here is what `changeset publish`
      # does via its `prepack` script, so a broken build fails CI, not the release.
      # The schema-sync test fails the build if the MCP action catalog drifts from
      # the addon's generated action schema.
      - name: MCP server checks
        run: pnpm --filter storybook-addon-playwright-mcp run typecheck test build
        env:
          CI: true
